- aid: technology-standards:oauth-openid
  name: OAuth and OpenID Connect
  description: >-
    OAuth 2.0 (RFC 6749) is the industry-standard protocol for authorization, enabling third-party applications
    to obtain limited access to web services. OpenID Connect (OIDC) is an identity layer built on top
    of OAuth 2.0 that enables clients to verify the identity of end users and obtain profile information.
    Together they form the foundation for API security and developer authentication across the modern
    web.
  humanURL: https://oauth.net/2/
  baseURL: https://oauth.net
