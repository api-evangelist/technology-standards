- aid: technology-standards:w3c-standards
  name: W3C Web Standards
  description: >-
    The World Wide Web Consortium (W3C) leads the World Wide Web to its full potential by developing open
    standards for web technologies. W3C standards critical to APIs include CORS (Cross-Origin Resource
    Sharing), Web Authentication (WebAuthn), Linked Data (RDF, JSON-LD), and the Activity Streams vocabulary.
    The W3C also maintains standards for semantic web technologies including OWL and SPARQL.
  humanURL: https://www.w3.org/standards/
  baseURL: https://www.w3.org
  tags:
  - CORS
  - Linked Data
  - Semantic Web
  - W3C
  - Web Standards
