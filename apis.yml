- aid: technology-standards:ieee-standards
  name: IEEE Standards
  description: >-
    The Institute of Electrical and Electronics Engineers (IEEE) develops standards for electronics, electrical
    engineering, and computer science. IEEE standards relevant to APIs and technology include IEEE 802
    (networking), IEEE P2510 (IoT data trust), and standards around software engineering lifecycle processes.
  humanURL: https://standards.ieee.org/
  baseURL: https://standards.ieee.org
  tags:
  - Computer Science
  - Electrical Engineering
  - IEEE
  - Networking
  properties:
  - type: Documentation
    url: https://standards.ieee.org/
  - type: Website
    url: https://standards.ieee.org/
- aid: technology-standards:oasis-standards
  name: OASIS Open Standards
  description: >-
    OASIS Open is a nonprofit standards development organization that advances the creation, convergence,
    and adoption of open standards for the global information society. OASIS standards relevant to APIs
    include SAML (Security Assertion Markup Language), OData (Open Data Protocol), WS-Security, MQTT,
    AMQP, and OpenDocument.
  humanURL: https://www.oasis-open.org/
  baseURL: https://www.oasis-open.org
  tags:
  - AMQP
  - MQTT
  - OData
  - OASIS
  - SAML
  properties:
