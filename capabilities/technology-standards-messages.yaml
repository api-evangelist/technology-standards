naftiko: 1.0.0-alpha2
info:
  label: IETF Datatracker API — Messages
  description: 'IETF Datatracker API — Messages. 1 operations. Lead operation: List messages. Self-contained Naftiko capability
    covering one Technology Standards business surface.'
  tags:
  - Technology Standards
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHNOLOGY_STANDARDS_API_KEY: TECHNOLOGY_STANDARDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: technology-standards-messages
    baseUri: https://datatracker.ietf.org/api/v1
    description: IETF Datatracker API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: message
      path: /message/
      operations:
      - name: listmessages
        method: GET
        description: List messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: technology-standards-messages-rest
    port: 8080
    description: REST adapter for IETF Datatracker API — Messages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/message
      name: message
      description: REST surface for message.
      operations:
      - method: GET
        name: listmessages
        description: List messages
        call: technology-standards-messages.listmessages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: technology-standards-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for IETF Datatracker API — Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-messages
      description: List messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: technology-standards-messages.listmessages
      outputParameters:
      - type: object
        mapping: $.
