naftiko: 1.0.0-alpha2
info:
  label: IETF Datatracker API — Documents
  description: 'IETF Datatracker API — Documents. 3 operations. Lead operation: List documents. Self-contained Naftiko capability
    covering one Technology Standards business surface.'
  tags:
  - Technology Standards
  - Documents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHNOLOGY_STANDARDS_API_KEY: TECHNOLOGY_STANDARDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: technology-standards-documents
    baseUri: https://datatracker.ietf.org/api/v1
    description: IETF Datatracker API — Documents business capability. Self-contained, no shared references.
    resources:
    - name: doc
      path: /doc/
      operations:
      - name: listdocuments
        method: GET
        description: List documents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: format
          in: query
          type: string
    - name: doc-docevent
      path: /doc/docevent/
      operations:
      - name: listdocevents
        method: GET
        description: List document events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: doc-document
      path: /doc/document/
      operations:
      - name: listdocumentrecords
        method: GET
        description: List document records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
  exposes:
  - type: rest
    namespace: technology-standards-documents-rest
    port: 8080
    description: REST adapter for IETF Datatracker API — Documents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/doc
      name: doc
      description: REST surface for doc.
      operations:
      - method: GET
        name: listdocuments
        description: List documents
        call: technology-standards-documents.listdocuments
        with:
          limit: rest.limit
          offset: rest.offset
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/doc/docevent
      name: doc-docevent
      description: REST surface for doc-docevent.
      operations:
      - method: GET
        name: listdocevents
        description: List document events
        call: technology-standards-documents.listdocevents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/doc/document
      name: doc-document
      description: REST surface for doc-document.
      operations:
      - method: GET
        name: listdocumentrecords
        description: List document records
        call: technology-standards-documents.listdocumentrecords
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: technology-standards-documents-mcp
    port: 9090
    transport: http
    description: MCP adapter for IETF Datatracker API — Documents. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-documents
      description: List documents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: technology-standards-documents.listdocuments
      with:
        limit: tools.limit
        offset: tools.offset
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
    - name: list-document-events
      description: List document events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: technology-standards-documents.listdocevents
      outputParameters:
      - type: object
        mapping: $.
    - name: list-document-records
      description: List document records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: technology-standards-documents.listdocumentrecords
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
