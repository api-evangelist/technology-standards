naftiko: 1.0.0-alpha2
info:
  label: IETF Datatracker API — Reviews
  description: 'IETF Datatracker API — Reviews. 1 operations. Lead operation: List reviews. Self-contained Naftiko capability
    covering one Technology Standards business surface.'
  tags:
  - Technology Standards
  - Reviews
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHNOLOGY_STANDARDS_API_KEY: TECHNOLOGY_STANDARDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: technology-standards-reviews
    baseUri: https://datatracker.ietf.org/api/v1
    description: IETF Datatracker API — Reviews business capability. Self-contained, no shared references.
    resources:
    - name: review
      path: /review/
      operations:
      - name: listreviews
        method: GET
        description: List reviews
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: technology-standards-reviews-rest
    port: 8080
    description: REST adapter for IETF Datatracker API — Reviews. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/review
      name: review
      description: REST surface for review.
      operations:
      - method: GET
        name: listreviews
        description: List reviews
        call: technology-standards-reviews.listreviews
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: technology-standards-reviews-mcp
    port: 9090
    transport: http
    description: MCP adapter for IETF Datatracker API — Reviews. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-reviews
      description: List reviews
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: technology-standards-reviews.listreviews
      outputParameters:
      - type: object
        mapping: $.
